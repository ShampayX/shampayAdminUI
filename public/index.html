<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />

    <!-- PWA primary color -->
    <meta name="theme-color" content="#00AB55" />

    <!-- Favicon -->
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="%PUBLIC_URL%/logo/shampay-mark.svg"
    />
    <link
      rel="icon"
      type="image/svg+xml"
      sizes="32x32"
      href="%PUBLIC_URL%/logo/shampay-mark.svg"
    />
    <link
      rel="icon"
      type="image/svg+xml"
      sizes="16x16"
      href="%PUBLIC_URL%/logo/shampay-mark.svg"
    />

    <!-- Using Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Barlow:wght@900&display=swap"
      rel="stylesheet"
    />

    <!-- Using Local Font -->
    <link
      rel="stylesheet"
      type="text/css"
      href="%PUBLIC_URL%/fonts/index.css"
    />

    <title>Shampay Admin - Payments Control Center</title>
    <meta
      name="description"
      content="Shampay Admin is the operations console for the Shampay payments platform. Track every transaction, reconcile wallets, manage partners and vendors, and keep services running from one place."
    />
    <meta name="author" content="Shampay" />
  </head>

  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
